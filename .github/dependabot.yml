version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencias
      - seguridad
    commit-message:
      prefix: "chore(deps)"
    groups:
      # El núcleo de Angular se publica en bloque: actualizar
      # @angular/core sin @angular/common rompe la resolución de peers.
      angular:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
      # Material y CDK van sincronizados entre sí.
      angular-material:
        patterns:
          - "@angular/material"
          - "@angular/cdk"
      testing:
        patterns:
          - "karma*"
          - "jasmine*"
          - "@types/jasmine"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels:
      - dependencias
      - ci
    commit-message:
      prefix: "chore(ci)"
